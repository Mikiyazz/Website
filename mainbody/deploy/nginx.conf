# LOCAL HTTP ONLY. Production needs a separate HTTPS listener/certificate.
# Do not forward a caller-controlled X-Forwarded-Proto header.
limit_req_zone $binary_remote_addr zone=login_rate:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 350m;
    client_body_timeout 300s;
    client_header_timeout 30s;
    send_timeout 300s;
    keepalive_timeout 65s;
    limit_req_status 429;
    access_log off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;

    location = /accounts/login/ {
        limit_req zone=login_rate burst=10 nodelay;
        proxy_pass http://web:8000;
    }
    location = /accounts/register/ {
        limit_req zone=login_rate burst=10 nodelay;
        proxy_pass http://web:8000;
    }
    location = /admin/login/ {
        limit_req zone=login_rate burst=10 nodelay;
        proxy_pass http://web:8000;
    }
    location / {
        limit_req zone=api_rate burst=100 nodelay;
        proxy_pass http://web:8000;
    }
}
