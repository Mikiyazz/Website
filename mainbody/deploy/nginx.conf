# LOCAL HTTP ONLY. Production needs a separate HTTPS listener/certificate.
# Do not forward a caller-controlled X-Forwarded-Proto header.
limit_req_zone $binary_remote_addr zone=login_rate:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    # 其他证明材料允许 2000MB 的 .zip 打包材料，正文上限留约 5% 的 multipart 开销余量。
    # 该档位还需要：反代所在磁盘/临时目录可容纳 2GB 缓冲、上行带宽 ≥ 7MB/s 才能 5 分钟内传完。
    client_max_body_size 2100m;
    client_body_timeout 600s;
    client_header_timeout 30s;
    send_timeout 600s;
    keepalive_timeout 65s;
    limit_req_status 429;
    access_log off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 10s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;

    location = /accounts/login/ {
        limit_req zone=login_rate burst=10 nodelay;
        proxy_pass http://web:8000;
    }
    location = /accounts/register/ {
        limit_req zone=login_rate burst=10 nodelay;
        proxy_pass http://web:8000;
    }
    location = /admin/login/ {
        limit_req zone=login_rate burst=10 nodelay;
        proxy_pass http://web:8000;
    }
    location / {
        limit_req zone=api_rate burst=100 nodelay;
        proxy_pass http://web:8000;
    }
}
