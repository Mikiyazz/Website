# 矿大校内纯 HTTP 内网 / 本地默认模板：
# - 若采用校内无证书纯 HTTP 访问：.env 设 DJANGO_USE_HTTPS=false（默认直接 200，无 301 循环）；
# - 若采用独立 HTTPS 证书：改用 deploy/nginx.https.conf（设 NGINX_CONF_FILE=./deploy/nginx.https.conf 与 DJANGO_USE_HTTPS=true）；
# - 若部署在学校前置 HTTPS 网关之后：改用 deploy/nginx.gateway.conf（设 NGINX_CONF_FILE=./deploy/nginx.gateway.conf 与 DJANGO_USE_HTTPS=true）。

# 校内 NAT / 宿舍楼出口共享 IP 友好限流：
# 登录/注册 60r/m + burst=200，确保同楼同分钟百人集中登录 0 误杀；全站接口 150r/s + burst=400。
limit_req_zone $binary_remote_addr zone=login_rate:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=150r/s;

server {
    listen 80;
    server_name _;

    # 仅信任内网/校内前置反向代理透传的真实客户端 IP（若直面公网请收窄为具体网关 IP）
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 其他证明材料允许 2000MB 的 .zip 打包材料，正文上限留约 5% 的 multipart 开销余量。
    client_max_body_size 2100m;
    client_body_timeout 600s;
    client_header_timeout 30s;
    send_timeout 600s;
    keepalive_timeout 65s;
    limit_req_status 429;
    access_log off;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;

    # Django 鉴权后通过 X-Accel-Redirect: /internal-media/<path> 将大文件/导出包下载完全卸载给 Nginx。
    location /internal-media/ {
        internal;
        alias /app/media/;
        add_header X-Content-Type-Options nosniff always;
    }

    # 健康探针免限流，避免高峰期误判容器不健康
    location = /health/live/ {
        proxy_pass http://web:8000;
    }
    location = /health/ready/ {
        proxy_pass http://web:8000;
    }

    location = /accounts/login/ {
        limit_req zone=login_rate burst=200 nodelay;
        proxy_pass http://web:8000;
    }
    location = /accounts/register/ {
        limit_req zone=login_rate burst=200 nodelay;
        proxy_pass http://web:8000;
    }
    location = /admin/login/ {
        limit_req zone=login_rate burst=200 nodelay;
        proxy_pass http://web:8000;
    }
    location / {
        limit_req zone=api_rate burst=400 nodelay;
        proxy_pass http://web:8000;
    }
}
