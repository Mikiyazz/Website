# LOCAL HTTP ONLY. Production needs a separate HTTPS listener/certificate.
# Do not forward a caller-controlled X-Forwarded-Proto header.
limit_req_zone $binary_remote_addr zone=login_rate:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 20s;
    limit_req_status 429;
    access_log off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 35s;
    proxy_send_timeout 15s;

    location = /accounts/login/ {
        limit_req zone=login_rate burst=10 nodelay;
        proxy_pass http://web:8000;
    }
    location = /admin/login/ {
        limit_req zone=login_rate burst=10 nodelay;
        proxy_pass http://web:8000;
    }
    location / {
        limit_req zone=api_rate burst=100 nodelay;
        proxy_pass http://web:8000;
    }
}
