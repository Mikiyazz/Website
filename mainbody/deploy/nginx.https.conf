# 独立 HTTPS 证书部署模板（配合 .env 中 DJANGO_USE_HTTPS=true 使用）：
# - 将证书文件挂载到 /etc/nginx/certs/fullchain.pem 与 /etc/nginx/certs/privkey.pem
# - 80 端口统一 301 跳转至 443，443 端口固定向上游传递 X-Forwarded-Proto: https（无重定向循环）

limit_req_zone $binary_remote_addr zone=login_rate:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=150r/s;

server {
    listen 80;
    server_name _;

    location = /health/live/ {
        proxy_pass http://web:8000;
    }
    location = /health/ready/ {
        proxy_pass http://web:8000;
    }
    location / {
        return 301 https://$http_host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 2100m;
    client_body_timeout 600s;
    client_header_timeout 30s;
    send_timeout 600s;
    keepalive_timeout 65s;
    limit_req_status 429;
    access_log off;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;

    location /internal-media/ {
        internal;
        alias /app/media/;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /health/live/ {
        proxy_pass http://web:8000;
    }
    location = /health/ready/ {
        proxy_pass http://web:8000;
    }

    location = /accounts/login/ {
        limit_req zone=login_rate burst=200 nodelay;
        proxy_pass http://web:8000;
    }
    location = /accounts/register/ {
        limit_req zone=login_rate burst=200 nodelay;
        proxy_pass http://web:8000;
    }
    location = /admin/login/ {
        limit_req zone=login_rate burst=200 nodelay;
        proxy_pass http://web:8000;
    }
    location / {
        limit_req zone=api_rate burst=400 nodelay;
        proxy_pass http://web:8000;
    }
}
