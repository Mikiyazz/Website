name: practice-platform

x-app: &app
  build: .
  image: practice-platform:local
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgresql://${POSTGRES_USER:-practice}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-practice}
    CELERY_BROKER_URL: redis://redis:6379/0
    CACHE_URL: redis://redis:6379/1
  init: true
  restart: unless-stopped
  pids_limit: 128
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-practice}
      POSTGRES_USER: ${POSTGRES_USER:-practice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    command: ["postgres", "-c", "max_connections=60", "-c", "shared_buffers=128MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 768m
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 384m
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  migrate:
    <<: *app
    profiles: ["setup"]
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    mem_limit: 512m
  web:
    <<: *app
    command: ["gunicorn", "-c", "deploy/gunicorn.conf.py", "config.wsgi:application"]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "scripts/check_health.py"]
      interval: 20s
      timeout: 4s
      retries: 3
  dispatcher:
    <<: *app
    command: ["python", "manage.py", "dispatch_outbox"]
    mem_limit: 256m
    cpus: 0.5
  worker-validation:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-Q", "validation,maintenance", "--concurrency=2", "--loglevel=INFO", "--hostname=validation@%h"]
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 360s
  worker-exports:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-Q", "exports", "--concurrency=1", "--loglevel=INFO", "--hostname=exports@%h"]
    mem_limit: 512m
    cpus: 0.5
    stop_grace_period: 360s
  nginx:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 128m
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

volumes:
  postgres_data:
  redis_data:
